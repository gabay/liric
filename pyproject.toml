[project]
name = "liric"
version = "0.1.0"
description = "Music library lyrics enrichment CLI tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
]

[project.scripts]
liric = "liric.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
